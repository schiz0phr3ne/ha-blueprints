blueprint:
  name: Aqara - Interrupteur sans-fil double (WRS-R02)
  description: |
    # Aqara - Interrupteur sans-fil double (WRS-R02)

    Grâce aux automatisations créées avec ce blueprint, il est possible
    d'exécuter tout type d'actions, via l'utilisation de l'interrupteur.

    Toutes les actions permises par l'interrupteur sont prises en comptes.

    **Compatible Zigbee2MQTT 2.x** via les MQTT device triggers.

    **Note :** chaque action de l'interrupteur doit avoir été déclenchée au moins une
    fois pour que Home Assistant la découvre automatiquement via MQTT.
  domain: automation
  input:
    controller_device:
      name: Contrôleur
      description: Périphérique MQTT de l'interrupteur Aqara WRS-R02.
      selector:
        device:
          filter:
            - integration: mqtt
              manufacturer: Aqara

    left_press_single:
      name: Gauche - appui simple
      description: Action(s) à exécuter lors d'un appui simple sur l'interrupteur gauche.
      default: []
      selector:
        action:

    left_press_double:
      name: Gauche - appui double
      description: Action(s) à exécuter lors d'un appui double sur l'interrupteur gauche.
      default: []
      selector:
        action:

    left_press_triple:
      name: Gauche - appui triple
      description: Action(s) à exécuter lors d'un appui triple sur l'interrupteur gauche.
      default: []
      selector:
        action:

    left_press_hold:
      name: Gauche - appui maintenu
      description: Action(s) à exécuter lors d'un appui maintenu sur l'interrupteur gauche.
      default: []
      selector:
        action: {}

    right_press_single:
      name: Droit - appui simple
      description: Action(s) à exécuter lors d'un appui simple sur l'interrupteur droit.
      default: []
      selector:
        action: {}

    right_press_double:
      name: Droit - appui double
      description: Action(s) à exécuter lors d'un appui double sur l'interrupteur droit.
      default: []
      selector:
        action:

    right_press_triple:
      name: Droit - appui triple
      description: Action(s) à exécuter lors d'un appui triple sur l'interrupteur droit.
      default: []
      selector:
        action:

    right_press_hold:
      name: Droit - appui maintenu
      description: Action(s) à exécuter lors d'un appui maintenu sur l'interrupteur droit.
      default: []
      selector:
        action: {}

    both_press_single:
      name: Les deux - appui simple
      description: Action(s) à exécuter lors d'un appui simple sur les 2 interrupteurs.
      default: []
      selector:
        action:

    both_press_double:
      name: Les deux - appui double
      description: Action(s) à exécuter lors d'un appui double sur les 2 interrupteurs.
      default: []
      selector:
        action:

    both_press_triple:
      name: Les deux - appui triple
      description: Action(s) à exécuter lors d'un appui triple sur les 2 interrupteurs.
      default: []
      selector:
        action:

    both_press_hold:
      name: Les deux - appui maintenu
      description: Action(s) à exécuter lors d'un appui maintenu sur les 2 interrupteurs.
      default: []
      selector:
        action:

mode: restart
max_exceeded: silent
trigger:
  - platform: device
    domain: mqtt
    device_id: !input controller_device
    type: action
    subtype: single_left
  - platform: device
    domain: mqtt
    device_id: !input controller_device
    type: action
    subtype: double_left
  - platform: device
    domain: mqtt
    device_id: !input controller_device
    type: action
    subtype: triple_left
  - platform: device
    domain: mqtt
    device_id: !input controller_device
    type: action
    subtype: hold_left
  - platform: device
    domain: mqtt
    device_id: !input controller_device
    type: action
    subtype: single_right
  - platform: device
    domain: mqtt
    device_id: !input controller_device
    type: action
    subtype: double_right
  - platform: device
    domain: mqtt
    device_id: !input controller_device
    type: action
    subtype: triple_right
  - platform: device
    domain: mqtt
    device_id: !input controller_device
    type: action
    subtype: hold_right
  - platform: device
    domain: mqtt
    device_id: !input controller_device
    type: action
    subtype: single_both
  - platform: device
    domain: mqtt
    device_id: !input controller_device
    type: action
    subtype: double_both
  - platform: device
    domain: mqtt
    device_id: !input controller_device
    type: action
    subtype: triple_both
  - platform: device
    domain: mqtt
    device_id: !input controller_device
    type: action
    subtype: hold_both

action:
  - choose:
      - conditions: "{{ trigger.payload == 'single_left' }}"
        sequence: !input left_press_single

      - conditions: "{{ trigger.payload == 'double_left' }}"
        sequence: !input left_press_double

      - conditions: "{{ trigger.payload == 'triple_left' }}"
        sequence: !input left_press_triple

      - conditions: "{{ trigger.payload == 'hold_left' }}"
        sequence: !input left_press_hold

      - conditions: "{{ trigger.payload == 'single_right' }}"
        sequence: !input right_press_single

      - conditions: "{{ trigger.payload == 'double_right' }}"
        sequence: !input right_press_double

      - conditions: "{{ trigger.payload == 'triple_right' }}"
        sequence: !input right_press_triple

      - conditions: "{{ trigger.payload == 'hold_right' }}"
        sequence: !input right_press_hold

      - conditions: "{{ trigger.payload == 'single_both' }}"
        sequence: !input both_press_single

      - conditions: "{{ trigger.payload == 'double_both' }}"
        sequence: !input both_press_double

      - conditions: "{{ trigger.payload == 'triple_both' }}"
        sequence: !input both_press_triple

      - conditions: "{{ trigger.payload == 'hold_both' }}"
        sequence: !input both_press_hold
